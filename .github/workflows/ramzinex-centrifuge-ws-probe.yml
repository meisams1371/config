name: Ramzinex official Centrifuge WebSocket probe

on:
  workflow_dispatch:
  push:
    branches:
      - ramzinex-x4g-iran-egress
    paths:
      - "scripts/ramzinex-centrifuge-probe.mjs"
      - ".github/workflows/ramzinex-centrifuge-ws-probe.yml"
      - "relay_app.py"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scanner dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Find read-only Iran egress routes that pass Ramzinex REST checks
        run: |
          python - <<'PY'
          import asyncio, json, os
          from urllib.parse import urlsplit
          import relay_app

          async def main():
              report = await relay_app.scan_iran_proxies(force=True)
              valid = []
              for row in report.get("ramzinex_ready", []):
                  proxy = str(row.get("proxy") or "").strip()
                  try:
                      parsed = urlsplit(proxy)
                      safe = (
                          parsed.scheme in ("http", "https")
                          and bool(parsed.hostname)
                          and parsed.port is not None
                          and parsed.username is None
                          and parsed.password is None
                          and not parsed.query
                          and not parsed.fragment
                          and row.get("geoip", {}).get("iran_confirmed") is True
                          and row.get("ramzinex_ready") is True
                      )
                  except Exception:
                      safe = False
                  if safe:
                      valid.append((proxy, row))
              route_source = "live-scan"
              # If the live public list is temporarily stale, re-verify a few endpoints
              # that passed the Iran + Ramzinex REST checks in an earlier CI run.
              # These are only used when the same live verification passes again now.
              if not valid:
                  import ipaddress, httpx
                  route_source = "previously-verified-recheck"
                  seed_urls = [
                      "http://80.191.46.62:1090",
                      "http://2.179.95.57:8080",
                      "http://185.129.213.210:8080",
                  ]
                  async with httpx.AsyncClient(
                      timeout=relay_app._DIRECT_TIMEOUT,
                      follow_redirects=False,
                      trust_env=False,
                      headers={"User-Agent": "X4G-WS-Route-Recheck/1.0"},
                  ) as direct_client:
                      async def recheck(proxy):
                          parsed = urlsplit(proxy)
                          ip = str(parsed.hostname or "")
                          try:
                              address = ipaddress.ip_address(ip)
                              if parsed.scheme not in ("http", "https") or not address.is_global or not parsed.port:
                                  return None
                          except Exception:
                              return None
                          candidate = {
                              "proxy": proxy,
                              "ip": ip,
                              "port": parsed.port,
                              "anonymity": "previously-verified",
                              "listed_city": "Unknown",
                          }
                          try:
                              row = await relay_app._test_http_proxy(candidate, direct_client)
                              if row.get("ramzinex_ready") is True and row.get("geoip", {}).get("iran_confirmed") is True:
                                  return (proxy, row)
                          except Exception:
                              return None
                          return None
                      checked = await asyncio.gather(*(recheck(proxy) for proxy in seed_urls))
                      valid.extend(item for item in checked if item)
              valid.sort(key=lambda item: item[1].get("latency_ms", 999999))
              valid = valid[:3]
              if not valid:
                  route_source = "none"
              if valid:
                  for proxy, _ in valid:
                      print("::add-mask::" + proxy)
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                      env.write("RAMZINEX_WS_HTTP_PROXIES=" + ",".join(item[0] for item in valid) + "\n")
              safe_report = {
                  "checked_at": report.get("checked_at"),
                  "verified_routes_count": len(valid),
                  "route_source": route_source,
                  "routes": [
                      {
                          "route_index": index + 1,
                          "city": row.get("geoip", {}).get("city"),
                          "latency_ms": row.get("latency_ms"),
                          "pairs_status": row.get("pairs_status"),
                          "orderbook_status": row.get("orderbook_status"),
                          "iran_geoip_confirmed": row.get("geoip", {}).get("iran_confirmed"),
                          "ramzinex_rest_confirmed": row.get("ramzinex_ready"),
                      }
                      for index, (_, row) in enumerate(valid)
                  ],
                  "proxy_values_written_to_github_env": bool(valid),
                  "warning": "Only uncredentialed public market-data traffic is tested; discovered proxy URLs are not printed.",
              }
              print(json.dumps(safe_report, ensure_ascii=False, indent=2))
          asyncio.run(main())
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install official Centrifuge SDK and WebSocket proxy transport
        run: npm install --no-save --no-package-lock centrifuge@5.3.4 ws@8.18.3 https-proxy-agent@7.0.6
      - name: Connect, subscribe, and observe public market channels
        env:
          RAMZINEX_WS_HTTP_PROXY: ${{ secrets.RAMZINEX_WS_HTTP_PROXY }}
        run: node scripts/ramzinex-centrifuge-probe.mjs
