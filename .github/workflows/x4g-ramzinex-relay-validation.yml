name: X4G Ramzinex relay syntax and guardrail test

on:
  push:
    branches:
      - ramzinex-x4g-iran-egress

permissions:
  contents: read

jobs:
  validate-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned X4G dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python modules
        run: python -m py_compile main.py relay_app.py
      - name: Test relay guards without making network requests
        env:
          RAMZINEX_UPSTREAM_PROXY: http://127.0.0.1:8080
          RAMZINEX_RELAY_TOKEN: test-only-not-a-real-secret-token-1234567890
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import relay_app

          client = TestClient(relay_app.app)

          health = client.get("/health")
          assert health.status_code == 200, health.text
          assert health.json()["upstream_proxy_configured"] is True
          assert health.json()["relay_token_configured"] is True

          # Missing token must be rejected before any outbound request.
          unauthorized = client.get("/ramzinex/pairs")
          assert unauthorized.status_code == 401, unauthorized.text

          headers = {"Authorization": "Bearer " + relay_app.TOKEN}

          # Unlisted paths and arbitrary query parameters must be rejected.
          denied_path = client.get("/ramzinex/anything/at/all", headers=headers)
          assert denied_path.status_code == 404, denied_path.text

          denied_query = client.get(
              "/ramzinex/pairs?target=https://example.com",
              headers=headers,
          )
          assert denied_query.status_code == 400, denied_query.text

          # Verify the WebSocket bridge only forwards public, read-only Centrifuge commands.
          assert relay_app._valid_ws_token(relay_app.TOKEN) is True
          assert relay_app._valid_ws_token("wrong-test-token") is False
          assert relay_app._is_allowed_centrifuge_frame(
              '{"connect":{"name":"js"},"id":1}'
          )
          assert relay_app._is_allowed_centrifuge_frame(
              '{"subscribe":{"channel":"orderbook:11","recover":true,"delta":"fossil"},"id":2}'
          )
          assert relay_app._is_allowed_centrifuge_frame(
              '{"subscribe":{"channel":"last-trades:11","recover":true,"delta":"fossil"},"id":3}'
          )
          assert relay_app._is_allowed_centrifuge_frame('{}')
          assert not relay_app._is_allowed_centrifuge_frame(
              '{"subscribe":{"channel":"private:orders:11"},"id":4}'
          )
          assert not relay_app._is_allowed_centrifuge_frame(
              '{"publish":{"channel":"orderbook:11","data":{}},"id":5}'
          )
          assert not relay_app._is_allowed_centrifuge_frame(
              '{"connect":{"name":"js","token":"private-token"},"id":6}'
          )

          print("relay syntax, guardrail, and read-only WebSocket tests passed")
          PY
